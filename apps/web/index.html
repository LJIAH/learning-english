<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English App</title>
    <style>
      /* 首屏骨架：JS 产物加载/执行期间占位，避免白屏。
         内联在此（约 1KB，不产生额外请求），Vue 挂载时 #app 内容会被替换 */
      html,
      body {
        margin: 0;
        background: #f9fafb;
      }
      .sk-header {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 80px;
        padding: 0 24px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        max-width: 1152px;
        margin: 0 auto;
      }
      .sk-logo,
      .sk-bar,
      .sk-pill,
      .sk-avatar,
      .sk-line {
        display: block;
        background: #e5e7eb;
        border-radius: 8px;
      }
      .sk-logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: #4338ca;
        opacity: 0.85;
      }
      .sk-bar {
        width: 120px;
        height: 20px;
      }
      .sk-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin-left: auto;
      }
      .sk-main {
        max-width: 1200px;
        margin: 40px auto 0;
        padding: 0 24px;
      }
      /* 与首页 banner 同色同高，骨架切真实内容时不跳变 */
      .sk-hero {
        min-height: 440px;
        border-radius: 20px;
        background: #111827;
        padding: 32px;
        box-sizing: border-box;
      }
      .sk-hero .sk-pill {
        width: 132px;
        height: 32px;
        border-radius: 100px;
        background: #312e81;
      }
      .sk-hero .sk-line {
        height: 24px;
        margin-top: 24px;
        background: #374151;
      }
      .sk-w-60 {
        width: 60%;
      }
      .sk-w-40 {
        width: 40%;
      }
      .sk-w-20 {
        width: 20%;
      }
      .sk-list {
        margin-top: 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sk-list .sk-line {
        height: 24px;
        margin-top: 24px;
        background: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div aria-hidden="true">
        <div class="sk-header">
          <span class="sk-logo"></span>
          <span class="sk-bar"></span>
          <span class="sk-bar"></span>
          <span class="sk-avatar"></span>
        </div>
        <div class="sk-main">
          <div class="sk-hero">
            <span class="sk-pill"></span>
            <span class="sk-line sk-w-60"></span>
            <span class="sk-line sk-w-40"></span>
          </div>
          <div class="sk-list">
            <div class="sk-line sk-w-20"></div>
            <div class="sk-line sk-w-40"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
